name: Site Monitor

# on:
#   schedule:
#     - cron: '0 * * * *' # 매시간 정각 실행
on:
  workflow_dispatch: # 수동 실행 버튼 활성화
    inputs:
      site_name:
        description: '모니터링할 사이트 선택'
        required: true
        default: 'All'
        type: choice
        options:
          - 'All'
          - 'NYPC'
          - 'NDC'
          - 'Nexon IP'
          - 'Nexon HQ'
          - 'select all'
          - 'Nexon Space'
          - 'Nexon Computer Museum'
          - 'Nexon Hero'
          - 'Nexon Company'
          - 'Nexon Blog'
          - 'Nexon Networks'
          - 'Nexon Pressroom'
          - 'Nexon Brand'
          - 'Nexon Foundation'

# 저장소에 쓰기 권한을 명시적으로 부여합니다.
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 전체 이력을 가져와서 충돌 방지

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Monitor
        run: npx tsx monitor.ts "${{ github.event.inputs.site_name }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 새 파일들을 스테이징에 추가
          git add reports/ screenshots/
          
          # 변경사항이 있을 때만 커밋 및 푸시
          if ! git diff --cached --quiet; then
            git commit -m "chore: update monitoring reports [skip ci]"
            # 다른 작업과 충돌을 방지하기 위해 pull 후 push
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
